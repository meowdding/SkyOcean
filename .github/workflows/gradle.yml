name: Build

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version: [ '26.1', '26.2', '26.3' ]
        steps:
            -   uses: actions/checkout@v5
            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'
            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew
            -   name: Build
                run: ./gradlew build -PskipDetekt -Pdatagen
            -   name: Upload Artifact ${{ matrix.version }}
                uses: actions/upload-artifact@v7.0.0
                with:
                    archive: false
                    path: build/libs/*-${{ matrix.version }}.jar
